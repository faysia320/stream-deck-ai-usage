<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 12px; background: #2d2d2d; color: #d8d8d8; font: 13px "Segoe UI", sans-serif; }
  label { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  span { width: 72px; }
  select { flex: 1; background: #3d3d3d; color: #d8d8d8; border: 0; border-radius: 3px; padding: 4px; font: inherit; }
</style>
</head>
<body>
<label><span>표시 방식</span>
  <select id="display">
    <option value="text">숫자</option>
    <option value="graph">그래프</option>
  </select>
</label>
<label><span>타이틀 표시</span><input type="checkbox" id="title" checked></label>
<script>
  // Called by Stream Deck when the inspector opens.
  function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
    const ws = new WebSocket(`ws://127.0.0.1:${port}`);
    const select = document.getElementById('display');
    const title = document.getElementById('title');
    try {
      const settings = JSON.parse(actionInfo).payload.settings;
      select.value = settings.display === 'graph' ? 'graph' : 'text';
      title.checked = settings.title !== false;
    } catch {}
    ws.onopen = () => ws.send(JSON.stringify({event: registerEvent, uuid}));
    const save = () => ws.send(JSON.stringify({event: 'setSettings', context: uuid,
                                               payload: {display: select.value, title: title.checked}}));
    select.onchange = save;
    title.onchange = save;
  }
</script>
</body>
</html>
